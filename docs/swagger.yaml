  /products:
    get:
      consumes:
      - application/json
      description: 根據查詢條件獲取商品列表,支援分頁、排序和篩選
      parameters:
      - description: 商品名稱
        in: query
        name: name
        type: string
      - description: 類別 slug
        in: query
        name: category
        type: string
      - description: 最低價格
        in: query
        name: min_price
        type: number
      - description: 最高價格
        in: query
        name: max_price
        type: number
      - description: 是否啟用
        in: query
        name: is_active
        type: boolean
      - description: 排序欄位
        enum:
        - price
        - created_at
        - name
        in: query
        name: sort_by
        type: string
      - description: 排序方向
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - default: 1
        description: 頁碼
        in: query
        name: page
        type: integer
      - default: 20
        description: 每頁數量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 獲取成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
