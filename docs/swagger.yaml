basePath: /api/v1
definitions:
  dto.AddToCartRequest:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  dto.CartItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      product:
        $ref: '#/definitions/dto.ProductResponse'
      product_id:
        type: string
      product_name:
        type: string
      product_price:
        type: number
      quantity:
        type: integer
      subtotal:
        type: number
      updated_at:
        type: string
    type: object
  dto.CartResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.CartItemResponse'
        type: array
      total_items:
        type: integer
      total_price:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.CategoryListResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/dto.CategoryResponse'
        type: array
      total:
        type: integer
    type: object
  dto.CategoryResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  dto.CreateCategoryRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  dto.CreateProductRequest:
    properties:
      category_id:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        minimum: 0
        type: number
      stock_quantity:
        minimum: 0
        type: integer
    required:
    - name
    - price
    - stock_quantity
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserSummary'
    type: object
  dto.ProductListResponse:
    properties:
      products:
        items:
          $ref: '#/definitions/dto.ProductResponse'
        type: array
      total:
        type: integer
    type: object
  dto.ProductResponse:
    properties:
      category_id:
        type: string
      category_name:
        type: string
      category_slug:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      stock_quantity:
        type: integer
      updated_at:
        type: string
    type: object
  dto.RefreshTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - password
    - phone
    type: object
  dto.RegisterResponse:
    properties:
      user:
        $ref: '#/definitions/dto.UserSummary'
    type: object
  dto.StandardResponse:
    properties:
      data: {}
      error:
        type: string
      success:
        type: boolean
    type: object
  dto.UpdateCartItemRequest:
    properties:
      quantity:
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  dto.UpdateCategoryRequest:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - id
    - name
    - slug
    type: object
  dto.UpdateProductRequest:
    properties:
      category_id:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        minimum: 0
        type: number
      stock_quantity:
        minimum: 0
        type: integer
    required:
    - name
    type: object
  dto.UpdateProductStockRequest:
    properties:
      stock_quantity:
        minimum: 0
        type: integer
    required:
    - stock_quantity
    type: object
  dto.UserSummary:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@example.com
    name: API Support
  description: A e-commerce API server
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: ECOM API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用 email 和密碼登入
      parameters:
      - description: 登入資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登入成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 認證失敗
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 用戶登入
      tags:
      - auth
  /auth/logout:
    post:
      description: 清除 refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 用戶登出
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 獲取新的 access token
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RefreshTokenResponse'
              type: object
        "401":
          description: 無效的 refresh token
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 刷新訪問令牌
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 創建新的用戶帳號
      parameters:
      - description: 註冊資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 註冊成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RegisterResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 註冊新用戶
      tags:
      - auth
  /cart:
    delete:
      consumes:
      - application/json
      description: 清空當前使用者的購物車
      produces:
      - application/json
      responses:
        "204":
          description: 清空成功
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 購物車不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 清空購物車
      tags:
      - cart
    get:
      consumes:
      - application/json
      description: 獲取當前使用者的購物車資訊
      produces:
      - application/json
      responses:
        "200":
          description: 獲取成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CartResponse'
              type: object
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 獲取購物車
      tags:
      - cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: 將商品添加到購物車，如果商品已存在則增加數量
      parameters:
      - description: 商品資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddToCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 添加成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CartResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 商品不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "409":
          description: 庫存不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 添加商品到購物車
      tags:
      - cart
  /cart/items/{id}:
    delete:
      consumes:
      - application/json
      description: 從購物車中移除指定商品
      parameters:
      - description: 購物車項目 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 移除成功
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 購物車項目不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 移除購物車項目
      tags:
      - cart
    put:
      consumes:
      - application/json
      description: 更新購物車中商品的數量
      parameters:
      - description: 購物車項目 ID
        in: path
        name: id
        required: true
        type: string
      - description: 數量資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CartResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 購物車項目不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "409":
          description: 庫存不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 更新購物車項目
      tags:
      - cart
  /categories:
    get:
      consumes:
      - application/json
      description: 獲取所有類別列表
      produces:
      - application/json
      responses:
        "200":
          description: 獲取成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryListResponse'
              type: object
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 獲取所有類別
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: 創建新的商品類別(僅管理員)
      parameters:
      - description: 類別資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 創建成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 創建新類別
      tags:
      - categories
  /categories/:id:
    put:
      consumes:
      - application/json
      description: 根據 id 更新商品類別(僅管理員)
      parameters:
      - description: 類別資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 創建成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 更新指定類別
      tags:
      - categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: 根據 ID 刪除商品類別(僅管理員)
      parameters:
      - description: 類別 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 刪除成功
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 刪除指定類別
      tags:
      - categories
    get:
      consumes:
      - application/json
      description: 根據 ID 獲得類別詳情
      parameters:
      - description: 類別 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 獲取成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "404":
          description: 找不到
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 獲得單個類別
      tags:
      - categories
  /categories/{id}/products:
    get:
      consumes:
      - application/json
      description: 根據類別 ID 獲取該類別下的所有商品
      parameters:
      - description: 類別 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 獲取成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ProductResponse'
                  type: array
              type: object
        "404":
          description: 類別不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 根據類別獲取商品列表
      tags:
      - products
  /products:
    get:
      consumes:
      - application/json
      description: 根據查詢條件獲取商品列表,支援分頁、排序和篩選
      parameters:
      - description: 商品名稱
        in: query
        name: name
        type: string
      - description: 類別 slug
        in: query
        name: category
        type: string
      - description: 最低價格
        in: query
        name: min_price
        type: number
      - description: 最高價格
        in: query
        name: max_price
        type: number
      - description: 是否啟用
        in: query
        name: is_active
        type: boolean
      - description: 排序欄位
        enum:
        - price
        - created_at
        - name
        in: query
        name: sort_by
        type: string
      - description: 排序方向
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - default: 1
        description: 頁碼
        in: query
        name: page
        type: integer
      - default: 20
        description: 每頁數量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 獲取成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductListResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 獲取商品列表
      tags:
      - products
    post:
      consumes:
      - application/json
      description: 創建新商品 (需要管理員權限)
      parameters:
      - description: 商品資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 創建成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 創建商品
      tags:
      - products
  /products/{id}:
    delete:
      consumes:
      - application/json
      description: 刪除商品 (需要管理員權限)
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 刪除成功
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 商品不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 刪除商品
      tags:
      - products
    get:
      consumes:
      - application/json
      description: 根據商品 ID 獲取商品詳細資訊
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 獲取成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductResponse'
              type: object
        "404":
