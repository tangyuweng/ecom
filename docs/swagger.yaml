basePath: /api/v1
definitions:
  dto.AddToCartRequest:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  dto.CartItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      product:
        $ref: '#/definitions/dto.ProductResponse'
      product_id:
        type: string
      product_name:
        type: string
      product_price:
        type: number
      quantity:
        type: integer
      subtotal:
        type: number
      updated_at:
        type: string
    type: object
  dto.CartResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.CartItemResponse'
        type: array
      total_items:
        type: integer
      total_price:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.CategoryListResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/dto.CategoryResponse'
        type: array
      total:
        type: integer
    type: object
  dto.CategoryResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  dto.CreateCategoryRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  dto.CreateOrderRequest:
    properties:
      recipient_name:
        maxLength: 50
        type: string
      shipping_address:
        maxLength: 255
        type: string
    required:
    - recipient_name
    - shipping_address
    type: object
  dto.CreateProductRequest:
    properties:
      category_id:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        minimum: 0
        type: number
      stock_quantity:
        minimum: 0
        type: integer
    required:
    - name
    - price
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.OrderItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      product:
        $ref: '#/definitions/dto.ProductResponse'
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
      subtotal:
        type: number
      unit_price:
        type: number
      updated_at:
        type: string
    type: object
  dto.OrderListResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/dto.OrderResponse'
        type: array
      total:
        type: integer
    type: object
  dto.OrderResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.OrderItemResponse'
        type: array
      order_date:
        type: string
      recipient_name:
        type: string
      shipping_address:
        type: string
      status:
        type: string
      total_amount:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.ProductListResponse:
    properties:
      products:
        items:
          $ref: '#/definitions/dto.ProductResponse'
        type: array
      total:
        type: integer
    type: object
  dto.ProductResponse:
    properties:
      category_id:
        type: string
      category_name:
        type: string
      category_slug:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      stock_quantity:
        type: integer
      updated_at:
        type: string
    type: object
  dto.RefreshTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - password
    - phone
    type: object
  dto.RegisterResponse:
    properties:
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.StandardResponse:
    properties:
      data: {}
      error:
        type: string
      success:
        type: boolean
    type: object
  dto.UpdateCartItemRequest:
    properties:
      quantity:
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  dto.UpdateCategoryRequest:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - id
    - name
    - slug
    type: object
  dto.UpdateOrderStatusRequest:
    properties:
      status:
        enum:
        - Pending
        - Processing
        - Shipped
        - Completed
        - Cancelled
        type: string
    required:
    - status
    type: object
  dto.UpdateProductRequest:
    properties:
      category_id:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        minimum: 0
        type: number
      stock_quantity:
        minimum: 0
        type: integer
    required:
    - name
    type: object
  dto.UpdateProductStockRequest:
    properties:
      stock_quantity:
        minimum: 0
        type: integer
    type: object
  dto.UpdateUserPasswordRequest:
    properties:
      new_password:
        type: string
      password:
        type: string
    required:
    - new_password
    - password
    type: object
  dto.UpdateUserRequest:
    properties:
      name:
        type: string
      phone:
        type: string
    required:
    - name
    - phone
    type: object
  dto.UpdateUserRoleRequest:
    properties:
      user_role:
        enum:
        - user
        - admin
        type: string
    required:
    - user_role
    type: object
  dto.UserListResponse:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@example.com
    name: API Support
  description: A e-commerce API server
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: ECOM API
  version: "1.0"
paths:
  /admin/categories:
    post:
      consumes:
      - application/json
      description: 創建新的商品類別(僅管理員)
      parameters:
      - description: 類別資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 創建成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 創建新類別
      tags:
      - admin
  /admin/categories/:id:
    put:
      consumes:
      - application/json
      description: 根據 id 更新商品類別(僅管理員)
      parameters:
      - description: 類別資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 創建成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 更新指定類別
      tags:
      - admin
  /admin/categories/{id}:
    delete:
      consumes:
      - application/json
      description: 根據 ID 刪除商品類別(僅管理員)
      parameters:
      - description: 類別 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 刪除成功
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 刪除指定類別
      tags:
      - admin
  /admin/orders:
    get:
      consumes:
      - application/json
      description: 管理員取得所有訂單（支援複合式查詢、分頁、排序）(僅管理員)
      parameters:
      - description: 訂單狀態過濾
        enum:
        - Pending
        - Processing
        - Shipped
        - Completed
        - Cancelled
        in: query
        name: status
        type: string
      - description: 用戶 ID 過濾
        in: query
        name: user_id
        type: string
      - description: 最小金額過濾
        in: query
        name: min_total
        type: number
      - description: 最大金額過濾
        in: query
        name: max_total
        type: number
      - description: 訂單開始日期 (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: 訂單結束日期 (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - default: created_at
        description: 排序欄位
        enum:
        - order_date
        - total_amount
        - status
        - created_at
        in: query
        name: sort_by
        type: string
      - default: desc
        description: 排序方向
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - default: 1
        description: 頁碼
        in: query
        name: page
        type: integer
      - default: 20
        description: 每頁數量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查詢成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderListResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無管理員權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 取得所有訂單
      tags:
      - admin
  /admin/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: 管理員更新訂單狀態，已完成或已取消的訂單不可更新(僅管理員)
      parameters:
      - description: 訂單 ID
        in: path
        name: id
        required: true
        type: string
      - description: 新狀態
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.OrderResponse'
              type: object
        "400":
          description: 請求參數錯誤或訂單狀態不允許更新
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無管理員權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 訂單不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 更新訂單狀態
      tags:
      - admin
  /admin/products:
    post:
      consumes:
      - application/json
      description: 創建新商品 (需要管理員權限)
      parameters:
      - description: 商品資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 創建成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 創建商品
      tags:
      - admin
  /admin/products/{id}:
    delete:
      consumes:
      - application/json
      description: 刪除商品 (需要管理員權限)
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 刪除成功
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 商品不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 刪除商品
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: 更新商品資訊 (需要管理員權限)
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      - description: 商品資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 商品不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 更新商品
      tags:
      - admin
  /admin/products/{id}/stock:
    patch:
      consumes:
      - application/json
      description: 更新商品庫存數量 (需要管理員權限)
      parameters:
      - description: 商品 ID
        in: path
        name: id
        required: true
        type: string
      - description: 庫存資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProductStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 無權限
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 商品不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 更新商品庫存
      tags:
      - admin
  /admin/users:
    get:
      consumes:
      - application/json
      description: 獲取所有使用者列表(僅管理員)
      produces:
      - application/json
      responses:
        "200":
          description: 獲取成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserListResponse'
              type: object
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 獲取所有使用者
      tags:
      - admin
  /admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      description: 更新使用者權限 (需要管理員權限)
      parameters:
      - description: 使用者 ID
        in: path
        name: id
        required: true
        type: string
      - description: 權限
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 未授權
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "403":
          description: 權限不足
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "404":
          description: 使用者不存在
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      security:
      - BearerAuth: []
      summary: 更新使用者權限
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用 email 和密碼登入
      parameters:
      - description: 登入資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登入成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: 請求參數錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "401":
          description: 認證失敗
          schema:
            $ref: '#/definitions/dto.StandardResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 用戶登入
      tags:
      - auth
  /auth/logout:
    post:
      description: 清除 refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/dto.StandardResponse'
      summary: 用戶登出
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 獲取新的 access token
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.StandardResponse'
            - properties:
